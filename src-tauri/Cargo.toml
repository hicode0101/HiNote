[package]
name = "hinote"
version = "0.1.0"
edition = "2021"
description = "HiNote - a local-first markdown notebook"

# The compiled deliverable must be named exactly `HiNote` (case-sensitive);
# the package name stays lowercase because Rust crate names are required to be.
[[bin]]
name = "HiNote"
path = "src/main.rs"

[lib]
name = "hinote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.37"
base64 = "0.22"
rand = "0.9"
chrono = "0.4"
arboard = "3"
notify = "7"
encoding_rs = "0.8"
chardetng = "0.1"
# Cross-platform: pasted screenshots are decoded on every OS (image_cmd.rs).
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
] }

[target.'cfg(windows)'.dependencies]
# Versions must stay aligned with wry's to share the same type definitions.
webview2-com = "0.39"
windows = { version = "0.62", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
